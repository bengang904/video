<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="profile-container">
        <div class="avatar">
            <img src="image.png" alt="Avatar">
        </div>
        <div class="profile-info">
            <h1>Cat_2024</h1>
            <div class="handle">@video.2024-10-24.zip</div>
            <div id="video-stats" class="stats">正在加载视频数量...</div>
            <p class="bio">分享生活趣事、创意点子。不定期更新..</p>
            <button class="share-btn" onclick="handleShare()">分享</button>
        </div>
    </header>

    <nav class="channel-tabs">
        <div id="tab-videos" class="tab active" onclick="switchTab(event, 'videos')">首页</div>
        <div id="tab-shorts" class="tab" onclick="switchTab(event, 'shorts')">Short</div>
    </nav>

    <main class="video-content">
        <div id="videos" class="content-pane active">
            <div id="long-video-container" class="video-grid"></div>
        </div>

        <div id="shorts" class="content-pane">
            <div id="short-video-container" class="video-grid short-grid"></div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadVideos();
            checkHash();
        });

        function checkHash() {
            if (window.location.hash === '#short') {
                const shortTab = document.getElementById('tab-shorts');
                if (shortTab) shortTab.click();
            }
        }

        async function loadVideos() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                const longContainer = document.getElementById('long-video-container');
                const shortContainer = document.getElementById('short-video-container');
                const statsElement = document.getElementById('video-stats');
                
                statsElement.textContent = `${data.videos.length}个视频`;
                
                data.videos.forEach(item => {
                    const isShort = item.type === 'short';
                    const finalUrl = `/web/${item.type}/?url=${encodeURIComponent(item.url)}`;

                    const html = `
                        <a href="${finalUrl}" target="_blank" rel="noopener noreferrer" class="video-item">
                            <div class="thumbnail-box">
                                <img src="${item.thumbnail}" alt="${item.title}" loading="lazy">
                                ${item.duration ? `<span class="duration">${item.duration}</span>` : ''}
                            </div>
                            <div class="video-details">
                                <div class="video-title">${item.title}</div>
                                <div class="video-date">${item.date || ''}</div>
                            </div>
                        </a>
                    `;
                    
                    if (isShort) {
                        shortContainer.insertAdjacentHTML('beforeend', html);
                    } else {
                        longContainer.insertAdjacentHTML('beforeend', html);
                    }
                });
            } catch (err) {
                console.error('无法加载视频数据:', err);
                document.getElementById('video-stats').textContent = '数据加载失败';
            }
        }

        function switchTab(event, sectionId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content-pane').forEach(p => p.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(sectionId).classList.add('active');

            if (sectionId === 'shorts') {
                history.replaceState(null, null, '#short');
            } else {
                history.replaceState(null, null, window.location.pathname);
            }
        }

        async function handleShare() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Cat_2024 Media',
                        text: '来看看精彩内容！',
                        url: window.location.href
                    });
                } catch (err) { console.log('分享取消'); }
            } else {
                alert('请复制链接：' + window.location.href);
            }
        }
    </script>
</body>
</html>
